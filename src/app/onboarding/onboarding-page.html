<div class="auth-shell">
  <div class="auth-card wide">
    <h1>Set up your workspace</h1>
    <p class="subtitle">Two quick steps and you'll see your Revenue Radar.</p>

    @if (errorMessage()) {
      <div class="form-error" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="name">Company name</label>
        <input id="name" type="text" formControlName="name" autocomplete="organization" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">Company name is required.</span>
        }
      </div>

      <fieldset class="choices">
        <legend>How do you want to start?</legend>
        @for (option of options; track option.value) {
          <label class="choice">
            <input type="radio" formControlName="start" [value]="option.value" />
            <span>
              <strong>{{ option.label }}</strong>
              <small>{{ option.hint }}</small>
            </span>
          </label>
        }
      </fieldset>

      <button class="submit" type="submit" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Creating workspace…' : 'Create workspace' }}
      </button>
    </form>
  </div>
</div>
