<div class="shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="shell-nav" aria-label="Main">
    <span class="brand">RecoverAI</span>
    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/opportunities" routerLinkActive="active">Opportunities</a>
      <a routerLink="/actions" routerLinkActive="active">Actions</a>
      <a routerLink="/import" routerLinkActive="active">Import</a>
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </div>
    <button class="sign-out" type="button" (click)="signOut()">Sign out</button>
  </nav>
  @if (simulationActive()) {
    <div class="simulation-banner">SIMULATION MODE — this data is generated, not real</div>
  }
  <main class="shell-content" id="main">
    <router-outlet />
  </main>
  <div class="toasts" aria-live="polite">
    @for (toast of toasts.toasts(); track toast.id) {
      <div class="toast" [class.toast-error]="toast.kind === 'error'" role="status">
        {{ toast.message }}
        <button type="button" aria-label="Dismiss" (click)="toasts.dismiss(toast.id)">×</button>
      </div>
    }
  </div>
</div>
